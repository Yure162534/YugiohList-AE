<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Details</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <header>
    <div class="logo">YugiohList Asian-English</div>
  </header>

  <!-- Tampilan kartu utama -->
  <main>
    <section class="cardBox">
      <h1 id="cardName">Loading...</h1>
      <div class="cardContent">
        <img id="cardImage" class="cardImage" alt="Card Image">
        <div class="cardDetails" id="cardDetails"></div>
      </div>
    </section>

    <!-- Link ke gallery.html -->
    <section class="galleryLink">
      <a id="galleryLink" href="gallery.html">Gallery</a>
    </section>

    <!-- Set info -->
    <section class="setInfo">
      <a id="backLink" href="list.html" class="backLink">Back to List Page</a>
      <h2>Asian-English</h2>
      <table>
        <thead>
          <tr>
            <th>Release</th>
            <th>Number</th>
            <th>Set</th>
            <th>Rarity</th>
          </tr>
        </thead>
        <tbody id="setTableBody"></tbody>
      </table>
    </section>
  </main>

  <script>
    // Ambil ID dari URL
    const params = new URLSearchParams(window.location.search);
    const cardId = params.get("id");

    // Ambil data dari JSON
    fetch("./data/cards.json")
      .then(response => response.json())
      .then(data => {
        const card = data[cardId];

        if (!card) {
          document.getElementById("cardName").textContent = "Card not found!";
          return;
        }

        // Isi data kartu
        document.title = `${card.name} - YugiohList`;
        document.getElementById("cardName").textContent = card.name;
        document.getElementById("cardImage").src = card.image;

        // Detail teks
        const detailsHTML = `
          <p><b>Japanese:</b> ${card.japanese}</p>
          <p><b>Rōmaji:</b> ${card.romaji}</p>
          <p><b>Card type:</b> ${card.cardType}</p>
          <p><b>Attribute:</b> ${card.attribute}</p>
          <p><b>Types:</b> ${card.types}</p>
          <p><b>Level:</b> ${card.level}</p>
          <p><b>ATK / DEF:</b> ${card.atk} / ${card.def}</p>
          <p><b>Card code:</b> ${card.cardcode}</p>
          <p class="effect">${card.effect}</p>
        `;
        document.getElementById("cardDetails").innerHTML = detailsHTML;

        // Link ke gallery
        document.getElementById("galleryLink").href = `gallery.html?id=${cardId}`;

        // Isi tabel set info
        const tbody = document.getElementById("setTableBody");
        tbody.innerHTML = card.sets.map(set => `
          <tr>
            <td>${set.release}</td>
            <td><a href="#">${set.number}</a></td>
            <td><a href="#">${set.set}</a></td>
            <td>${set.rarity}</td>
          </tr>
        `).join("");
      })
      .catch(err => {
        console.error("Error loading card data:", err);
      });
  </script>

</body>
</html>
